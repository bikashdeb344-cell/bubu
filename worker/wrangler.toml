name = "mmu-photo-portal-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ALLOWED_ORIGIN = "*"
MAX_FILE_SIZE_MB = "15"
MAX_FILES_PER_UPLOAD = "20"

# Note: The following secrets should NOT be committed in plain text.
# Set them using `wrangler secret put <KEY>` or in .dev.vars for local development:
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET
# - GOOGLE_REFRESH_TOKEN
# - GOOGLE_DRIVE_ROOT_FOLDER_ID
